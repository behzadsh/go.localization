version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/behzadsh/go.localization)
        - blank
        - dot

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errname
    - gocyclo
    - gocognit
    - godot
    - gosec
    - revive
    - misspell
    - prealloc
    - unconvert
    - nolintlint
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - errname
          - gocyclo
          - gocognit
          - godot
          - gosec
          - revive
          - misspell
          - prealloc
          - unconvert
          - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable:
        - shadow
    godot:
      capital: true
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          disabled: true
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-length
          disabled: true
        - name: function-result-limit
          arguments: [2]
        - name: line-length-limit
          disabled: false
          arguments: [120]
        - name: max-public-structs
          disabled: true
        - name: package-comments
          disabled: true
        - name: unhandled-error
          arguments:
            - "fmt.Printf"
            - "fmt.Println"
            - "fmt.Print"
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 15

